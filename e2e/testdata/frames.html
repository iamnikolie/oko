<!doctype html><html><head><title>Checkout</title></head><body><main>
<h1>Checkout</h1>
<p>Total: $42</p>
<iframe id="pay" title="Payment" width="420" height="220" style="border:1px solid #ccc"></iframe>
<script>
// The test passes the other test server's origin; accept only a loopback one.
const m = /^\?(http:\/\/127\.0\.0\.1:\d+)$/.exec(location.search);
if (m) document.getElementById('pay').src = m[1] + '/frame-child.html';
</script>
</main></body></html>
