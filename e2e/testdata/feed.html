<!doctype html><html><head><title>Feed</title></head><body><main>
<h1>Feed</h1>
<ul id="feed"></ul>
<script>
const ul = document.getElementById('feed');
for (let i = 1; i <= 400; i++) {
  const li = document.createElement('li'); li.className = 'post';
  li.innerHTML = '<h3>Post ' + i + '</h3><p>' + 'lorem ipsum '.repeat(20) + '</p>';
  ul.appendChild(li);
}
</script>
</main></body></html>
